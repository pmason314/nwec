[project]
name = "nwec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = { text = "MIT License" }
authors = [
    { name = "Peter Mason", email = "peter@petermason.me" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Natural Language :: English",
]
requires-python = ">=3.13"

dependencies = [
    "beautifulsoup4>=4.12.3",
    "dash>=2.18.2",
    "fastexcel>=0.11.6",
    "gunicorn>=23.0.0",
    "nbformat>=5.10.4",
    "nwec",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "plotly>=5.24.1",
    "polars>=1.6.0",
    "pyarrow>=21.0.0",
    "pydantic>=2.10.4",
    "python-dateutil>=2.9.0.post0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "scipy>=1.11.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "creosote>=3.0.2",
    "ipykernel>=6.29.5",
    "pre-commit>=3.8.0",
    "pytest>=8.3.2",
    "ruff>=0.8.1",
    "ty>=0.0.4",
]

[build-system]
requires      = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length   = 120
output-format = "concise"

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "COM812",  # Missing trailing comma (conflicts with ruff's formatter)
    "D203",    # Missing blank line after class docstring (alternative to D211)
    "D213",    # Docstring summary should start on the second line (alternative to D212)
    "EM",      # Assign exception strings to variables before raising them
    "ERA",     # Avoid commented-out code; check during CI/CD instead
    "F401",    # Avoid unused imports (check during pre-commit instead and CI/CD instead)
    "FBT001",  # Avoid positional boolean arguments, checked via type hints
    "FBT002",  # Avoid positional boolean arguments, checked via default values
    "FIX002",  # Avoid TODO comments
    "G004",    # Avoid f-strings in logging statements
    "PLR2004", # Avoid magic values in comparisons
    "S101",    # Avoid assert statements
    "S603",    # Avoid subprocess calls without validated input (prone to false positives)
    "S607",    # Avoid starting a process with a partial executable path
    "T201",    # Avoid using print()
    "TD002",   # Missing author in TODO comment
    "TD003",   # Missing issue link in TODO comment
    "TRY003",  # Avoid long exception messages outside the exception class
]
unfixable = [
]

[tool.ruff.lint.per-file-ignores]
"dashboard/callbacks/**" = ["C901", "PLR0915"] # Ignore statement count in callbacks

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.creosote]
exclude-deps = [
    "beautifulsoup4",
    "dash",
    "fastexcel",
    "gunicorn",
    "nbformat",
    "pandas",
    "plotly",
    "pyarrow",
    "requests",
]
venvs = [".venv"]
paths = ["nwec", "tests"]
deps-file = "pyproject.toml"
sections = ["project.dependencies"]

[tool.pyright]
reportArgumentType      = false
reportOptionalSubscript = false
